# Training Configuration
# Training hyperparameters, optimization, and experiment settings

# Training settings
training:
  batch_size: 16
  num_epochs: 100
  gradient_accumulation_steps: 1  # Effective batch size = batch_size * this
  
  # Mixed precision training
  mixed_precision:
    enabled: false  # Set to true for fp16 training
    opt_level: O1   # Options: O0, O1, O2, O3
  
  # Gradient clipping
  gradient_clipping:
    enabled: true
    max_norm: 1.0

# Optimizer settings
optimizer:
  type: adam  # Options: 'adam', 'adamw', 'sgd'
  learning_rate: 0.001
  weight_decay: 0.0001
  
  # Adam-specific
  betas: [0.9, 0.999]
  eps: 1.0e-8
  
  # SGD-specific (if using SGD)
  momentum: 0.9
  nesterov: true

# Learning rate scheduler
scheduler:
  type: cosine  # Options: 'cosine', 'step', 'plateau', 'none'
  
  # Cosine annealing
  T_max: 100  # Should match num_epochs
  eta_min: 1.0e-6
  
  # Step decay
  step_size: 30
  gamma: 0.1
  
  # ReduceLROnPlateau
  patience: 10
  factor: 0.5
  min_lr: 1.0e-6
  
  # Warmup
  warmup:
    enabled: true
    warmup_epochs: 5
    warmup_lr: 1.0e-5

# Loss weights
loss_weights:
  layer2: 0.3   # Joinability loss
  layer3: 1.0   # Augmentation loss
  
# Class weights for imbalanced data
class_weights:
  layer2:
    enabled: true
    auto_compute: true  # Compute from data
    manual_weights: [1.0, 1.0]  # [negative, positive]
  
  layer3:
    enabled: true
    auto_compute: true
    manual_weights: [1.0, 1.0]

# Data split
data_split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_by: dataset  # Options: 'dataset', 'random', 'stratified'
  random_seed: 42

# Checkpointing
checkpointing:
  save_dir: ./experiments
  experiment_name: table_augmentation
  save_every_n_epochs: 5
  save_best_only: true
  metric_to_monitor: val_f1_layer3  # Options: val_loss, val_f1_layer2, val_f1_layer3
  mode: max  # 'max' for metrics, 'min' for loss
  
# Early stopping
early_stopping:
  enabled: true
  patience: 15
  metric_to_monitor: val_f1_layer3
  mode: max
  min_delta: 0.001

# Logging
logging:
  log_every_n_steps: 10
  log_gradients: false
  log_weights: false
  
  # Tensorboard
  tensorboard:
    enabled: false  # Using Aim instead
    log_dir: ./experiments/logs
  
  # Wandb (optional)
  wandb:
    enabled: false
    project: table-augmentation
    entity: null
    tags: [sample-data, tableformer, graph-transformer]
  
  # Aim - Experiment tracking (recommended)
  aim:
    enabled: true
    repo_path: ./aim_logs  # Aim repository location
    experiment_name: table_augmentation
    log_system_params: true  # Log system info (CPU, GPU, memory)
    log_code: true  # Track code changes
    
    # Metrics to track
    track_metrics:
      - loss
      - accuracy
      - precision
      - recall
      - f1
      - auc
      - learning_rate
    
    # Track metrics by layer
    track_by_layer: true  # Separate tracking for Layer 2 and Layer 3

# Evaluation during training
evaluation:
  eval_every_n_epochs: 1
  compute_test_metrics: false  # Only at the end
  
  # Metrics to compute
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - auc
  
  # Detailed analysis
  save_predictions: true
  save_confusion_matrix: true
  per_dataset_analysis: true

# Hardware settings
hardware:
  device: cuda  # Options: 'cuda', 'cpu'
  num_workers: 4
  pin_memory: true
  
  # Multi-GPU training
  distributed:
    enabled: false
    backend: nccl  # Options: 'nccl', 'gloo'
    world_size: 1

# Reproducibility
reproducibility:
  deterministic: true
  benchmark: false  # Set to true for faster training (non-deterministic)
  seed: 42

# Debug settings
debug:
  enabled: false
  fast_dev_run: false  # Run 1 batch for testing
  overfit_batches: 0   # Set to N to overfit on N batches
  profile_memory: false

